name: build-release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: bash build.sh

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.1.0"
          NOTES="HugoTV v0.1.0：轻量中文电视桌面启动器（无广告、不联网、本地运行）。APK 为 CI 自动构建并签名（临时调试密钥，升级请先卸载旧版）。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --title "HugoTV $TAG" --notes "$NOTES"
          fi

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hugotv-apk
          path: dist/*.apk
